<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<title>SUNDAY.EXE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050505;color:#eee;font-family:monospace;padding:15px}
main{max-width:560px;min-height:95vh;margin:auto;border:1px solid #292929;background:#090909;padding:22px;display:flex;flex-direction:column}
pre{color:#8cff9b;font-size:11px;line-height:1.6;white-space:pre-wrap}
h1{letter-spacing:4px;font-size:29px;margin:25px 0 5px}
h2{font-size:11px;color:#666;font-weight:normal}
p{font-size:13px;line-height:1.7;color:#bbb}
.card{border:1px solid #292929;padding:14px;margin:15px 0;font-size:11px;line-height:2}
.green{color:#8cff9b}.yellow{color:#ffd166}
.buttons{margin-top:auto;display:grid;gap:10px}
button{padding:15px;background:#090909;color:#eee;border:1px solid #444;font:inherit;text-align:left}
button:active{border-color:#8cff9b}
.footer{margin-top:20px;padding-top:10px;border-top:1px solid #222;color:#444;font-size:9px}
</style>
</head>

<body>
<main id="app"></main>

<script>
const a=document.getElementById("app");

function page(x){
a.innerHTML=x+'<div class="footer">SUNDAY.EXE // BUILD 04.10.26</div>';

</main>

</html>
