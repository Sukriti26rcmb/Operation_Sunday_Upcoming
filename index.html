const app=document.getElementById("app");

const events=[];

function track(e){

const item={
event:e,
time:new Date().toISOString()
};

events.push(item);

try{
localStorage.setItem(
"sunday_events",
JSON.stringify(events)
);
}catch(_){}

}

function render(body,event){

if(event){
track(event);
}

app.innerHTML=
'<div class="fade">'+body+
'</div>'+
'<div class="footer">'+
'<span>SUNDAY // CLASSIFIED</span>'+
